<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ApplyKit test application</title>
    <style>
      body { max-width: 680px; margin: 40px auto; font: 16px/1.5 system-ui, sans-serif; }
      form { display: grid; gap: 18px; }
      label { display: grid; gap: 6px; }
      input, select, textarea { padding: 10px; }
    </style>
  </head>
  <body>
    <h1>Sample application</h1>
    <form>
      <label>First name <input name="first_name"></label>
      <label>Last name <input name="last_name"></label>
      <label>Email address <input name="email" type="email"></label>
      <label>Phone number <input name="phone" type="tel"></label>
      <label>University <input name="university"></label>
      <label>Degree
        <select name="degree">
          <option value="">Choose one</option>
          <option value="arts">Arts</option>
          <option value="engineering">Engineering</option>
        </select>
      </label>
      <label>Expected graduation date <input name="graduation" type="month"></label>
      <label>Why are you interested? <textarea maxlength="300"></textarea></label>
      <label>Account password <input type="password"></label>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
